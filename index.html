<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pistolero contra los muertos</title>
<link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#261016;
    --sand:#f3d9a4;
    --blood:#b3262d;
    --dusk:#e08a4b;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;height:100%;background:#1a0b10;overflow:hidden;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    font-family:Georgia,'Times New Roman',serif;color:var(--sand);
  }
  canvas{display:block;width:100%;height:100%}
  #menu{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;text-align:center;background:rgba(26,11,16,.78);
  }
  #menu.hidden{display:none}
  h1{
    font-family:'Rye',Georgia,serif;font-weight:400;
    font-size:clamp(40px,12vw,72px);line-height:1;margin:0 0 6px;color:var(--sand);
    text-shadow:3px 3px 0 var(--blood);
  }
  .sub{font-style:italic;font-size:18px;margin:0 0 22px;color:var(--dusk)}
  #msg{max-width:300px;font-size:17px;line-height:1.5;margin:0 0 28px}
  button{
    font-family:'Rye',Georgia,serif;font-size:22px;letter-spacing:.5px;
    background:var(--sand);color:var(--ink);border:3px solid var(--ink);border-radius:6px;
    padding:14px 30px;box-shadow:5px 5px 0 var(--blood);cursor:pointer;
  }
  button:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--blood)}
  button:focus-visible{outline:3px solid #fff;outline-offset:3px}
  #reload{
    position:fixed;right:14px;bottom:14px;font-size:16px;padding:12px 16px;display:none;
    box-shadow:4px 4px 0 var(--blood);
  }
  #reload.show{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="reload">Recargar</button>
<div id="menu">
  <h1 id="title">Pistolero</h1>
  <p class="sub" id="sub">contra los muertos</p>
  <p id="msg">Tocá a un zombi para dispararle.<br>Un tiro en la cabeza vale doble.<br>Seis balas por tambor: cuando se acaben, recargá.</p>
  <button id="go">Desenfundar</button>
</div>

<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const menu = document.getElementById('menu'), go = document.getElementById('go');
const reloadBtn = document.getElementById('reload');
const FONT = "'Rye',Georgia,serif";

let W, H, DPR, HZ, K, HEND, bg;
let state = 'menu';
let zs = [], parts = [], floats = [];
let score = 0, best = 0, hp = 100, ammo = 6, reloading = false, rt = 0;
let combo = 0, wave = 0, toSpawn = 0, spawnT = 0, betweenT = 0, banner = null;
let shotCd = 0, flash = 0, recoil = 0, shake = 0, hurt = 0;
let aim = -Math.PI / 2;

/* ---------- audio ---------- */
let ac = null;
function initAudio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume();
}
function noise(dur, vol, cutoff) {
  if (!ac) return;
  const t = ac.currentTime;
  const b = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
  const n = ac.createBufferSource(); n.buffer = b;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
  const g = ac.createGain(); g.gain.value = vol;
  n.connect(f); f.connect(g); g.connect(ac.destination); n.start(t);
}
function tone(f0, f1, dur, type, vol, delay = 0) {
  if (!ac) return;
  const t = ac.currentTime + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + .02);
}
const snd = {
  shot() { noise(.25, .55, 2400); tone(150, 40, .18, 'sine', .6); },
  click() { tone(900, 500, .04, 'square', .12); },
  reload() { tone(700, 400, .05, 'square', .12); tone(500, 300, .05, 'square', .12, .35); tone(900, 600, .06, 'square', .14, .8); },
  hit() { noise(.12, .3, 900); tone(120, 60, .1, 'triangle', .3); },
  kill() { noise(.2, .35, 700); tone(90, 40, .2, 'sawtooth', .25); },
  hurt() { tone(110, 45, .3, 'sawtooth', .35); noise(.2, .3, 500); },
  over() { tone(220, 55, 1.1, 'sawtooth', .3); }
};

/* ---------- escenario ---------- */
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }

function cactus(g, x, y, s) {
  g.fillStyle = '#2c3a28';
  g.beginPath(); g.roundRect(x - 6 * s, y - 64 * s, 12 * s, 64 * s, 6 * s); g.fill();
  g.beginPath(); g.roundRect(x - 24 * s, y - 44 * s, 9 * s, 26 * s, 4.5 * s); g.fill();
  g.fillRect(x - 24 * s, y - 24 * s, 20 * s, 8 * s);
  g.beginPath(); g.roundRect(x + 15 * s, y - 52 * s, 9 * s, 24 * s, 4.5 * s); g.fill();
  g.fillRect(x + 2 * s, y - 32 * s, 18 * s, 8 * s);
}

function buildBG() {
  bg = document.createElement('canvas');
  bg.width = W * DPR; bg.height = H * DPR;
  const g = bg.getContext('2d'); g.scale(DPR, DPR);
  const r = rng(7);

  let gr = g.createLinearGradient(0, 0, 0, HZ);
  gr.addColorStop(0, '#2c1531'); gr.addColorStop(.55, '#a53f4c'); gr.addColorStop(1, '#f2a65e');
  g.fillStyle = gr; g.fillRect(0, 0, W, HZ + 2);

  g.fillStyle = 'rgba(255,226,160,.92)';
  g.beginPath(); g.arc(W * .68, HZ - 34 * K, 54 * K, 0, 7); g.fill();

  g.fillStyle = '#6b2f43';
  let x = -20;
  while (x < W + 20) {
    const w = (60 + r() * 90) * K, hh = (18 + r() * 38) * K;
    g.beginPath(); g.moveTo(x, HZ); g.lineTo(x + w * .1, HZ - hh); g.lineTo(x + w * .9, HZ - hh); g.lineTo(x + w, HZ); g.fill();
    x += w * (.6 + r() * .5);
  }

  const row = (x0, x1) => {
    let x = x0;
    while (x < x1) {
      const w = (34 + r() * 30) * K, hh = (36 + r() * 40) * K;
      g.fillStyle = '#261016'; g.fillRect(x, HZ - hh, w, hh + 2);
      if (r() < .6) { g.beginPath(); g.moveTo(x, HZ - hh); g.lineTo(x + w / 2, HZ - hh - 10 * K); g.lineTo(x + w, HZ - hh); g.fill(); }
      g.fillStyle = '#f3b562';
      if (r() < .7) g.fillRect(x + w * .2, HZ - hh * .7, w * .18, hh * .18);
      if (r() < .7) g.fillRect(x + w * .62, HZ - hh * .7, w * .18, hh * .18);
      x += w + (2 + r() * 6) * K;
    }
  };
  row(-10, W * .36); row(W * .64, W + 10);

  gr = g.createLinearGradient(0, HZ, 0, H);
  gr.addColorStop(0, '#b9774e'); gr.addColorStop(1, '#5e3330');
  g.fillStyle = gr; g.fillRect(0, HZ, W, H - HZ);

  g.fillStyle = 'rgba(240,190,120,.22)';
  g.beginPath(); g.moveTo(W * .4, HZ); g.lineTo(W * .6, HZ); g.lineTo(W * 1.15, H); g.lineTo(-W * .15, H); g.fill();
  g.strokeStyle = 'rgba(60,25,25,.25)'; g.lineWidth = 2;
  for (const o of [-.12, .12]) { g.beginPath(); g.moveTo(W * (.5 + o * .3), HZ); g.lineTo(W * (.5 + o * 2.2), H); g.stroke(); }

  cactus(g, W * .1, HZ + (H - HZ) * .12, .45 * K);
  cactus(g, W * .93, HZ + (H - HZ) * .1, .4 * K);
  cactus(g, W * .08, HZ + (H - HZ) * .5, 1.0 * K);
  cactus(g, W * .92, HZ + (H - HZ) * .38, .75 * K);

  gr = g.createLinearGradient(0, HZ - 20 * K, 0, HZ + 34 * K);
  gr.addColorStop(0, 'rgba(255,200,140,0)'); gr.addColorStop(.5, 'rgba(255,200,140,.28)'); gr.addColorStop(1, 'rgba(255,200,140,0)');
  g.fillStyle = gr; g.fillRect(0, HZ - 20 * K, W, 54 * K);
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  HZ = H * .42; K = Math.max(.6, Math.min(1.4, H / 800));
  HEND = H - 58 * K;
  buildBG();
}
window.addEventListener('resize', resize);

/* ---------- zombis ---------- */
const sc = y => .28 + .72 * Math.max(0, (y - HZ) / (HEND - HZ));
const sway = (z, h) => Math.sin(z.ph) * h * .03;

const TYPES = {
  walker: { h: 190, spd: 32, hp: 2, hd: 2, dmg: 8, pts: 50 },
  runner: { h: 175, spd: 72, hp: 2, hd: 2, dmg: 6, pts: 80 },
  brute:  { h: 260, spd: 22, hp: 7, hd: 3, dmg: 20, pts: 250 }
};
const SKINS = ['#8da86b', '#9bb27a', '#7f9a63'];
const SHIRTS = ['#5b3a46', '#3f5565', '#6d5a35', '#4a2f2f'];
const PANTS = ['#2c2a3a', '#3a3226'];
const pick = a => a[Math.floor(Math.random() * a.length)];

function spawn() {
  const r = Math.random();
  let type = 'walker';
  if (wave >= 4 && r < .12) type = 'brute';
  else if (wave >= 2 && r < .38) type = 'runner';
  const T = TYPES[type];
  zs.push({
    type, h: T.h, spd: T.spd * (1 + wave * .04), hp: T.hp, hd: T.hd, dmg: T.dmg, pts: T.pts,
    x0: W * (.32 + Math.random() * .36), x1: W * (.08 + Math.random() * .84),
    x: W / 2, y: HZ, ph: Math.random() * 6, wob: Math.random() * 6,
    flash: 0, atk: .5,
    skin: pick(SKINS), shirt: type === 'runner' ? '#7a2f2f' : pick(SHIRTS), pants: pick(PANTS)
  });
}

function drawZ(z) {
  const s = sc(z.y), h = z.h * K * s, sw = sway(z, h);
  const bob = Math.abs(Math.sin(z.ph)) * h * .02;
  ctx.save(); ctx.translate(z.x, z.y);
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(0, 0, h * .24, h * .055, 0, 0, 7); ctx.fill();

  const flashing = z.flash > 0;
  const col = c => flashing ? '#fff3df' : c;
  const l1 = Math.sin(z.ph) * h * .045;

  ctx.fillStyle = col(z.pants);
  ctx.fillRect(-h * .13 + l1 - h * .045, -h * .4, h * .09, h * .4);
  ctx.fillRect(h * .04 - l1, -h * .4, h * .09, h * .4);

  ctx.fillStyle = col(z.shirt);
  ctx.beginPath(); ctx.roundRect(-h * .17 + sw, -h * .76 + bob, h * .34, h * .38, h * .04); ctx.fill();
  if (!flashing) {
    ctx.fillStyle = 'rgba(20,5,8,.35)';
    ctx.fillRect(-h * .17 + sw, -h * .5 + bob, h * .12, h * .06);
    ctx.fillRect(h * .02 + sw, -h * .62 + bob, h * .1, h * .05);
    ctx.fillStyle = 'rgba(140,25,30,.8)';
    ctx.beginPath(); ctx.ellipse(sw + h * .03, -h * .52 + bob, h * .06, h * .04, 0, 0, 7); ctx.fill();
  }

  ctx.strokeStyle = col(z.skin); ctx.lineWidth = h * .07; ctx.lineCap = 'round';
  const reach = Math.sin(z.ph + 1) * h * .02;
  ctx.beginPath(); ctx.moveTo(-h * .17 + sw, -h * .7 + bob); ctx.lineTo(-h * .24 + sw, -h * .5 + reach); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(h * .17 + sw, -h * .7 + bob); ctx.lineTo(h * .24 + sw, -h * .52 - reach); ctx.stroke();

  const hr = h * .13, hy = -h * .86 + bob;
  ctx.fillStyle = col(z.skin);
  ctx.beginPath(); ctx.arc(sw, hy, hr, 0, 7); ctx.fill();
  if (!flashing) {
    ctx.fillStyle = '#f0e46a';
    ctx.beginPath(); ctx.arc(sw - hr * .38, hy - hr * .1, hr * .2, 0, 7); ctx.arc(sw + hr * .38, hy - hr * .1, hr * .2, 0, 7); ctx.fill();
    ctx.fillStyle = '#1a0b10';
    ctx.beginPath(); ctx.arc(sw - hr * .38, hy - hr * .1, hr * .08, 0, 7); ctx.arc(sw + hr * .38, hy - hr * .1, hr * .08, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(sw, hy + hr * .5, hr * .38, hr * .22, 0, 0, 7); ctx.fill();
  }

  if (z.type === 'brute' && z.hp > 0) {
    const bw = h * .3;
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(-bw / 2, hy - hr - 10 * K, bw, 5 * K);
    ctx.fillStyle = '#c33'; ctx.fillRect(-bw / 2, hy - hr - 10 * K, bw * (z.hp / TYPES.brute.hp), 5 * K);
  }
  ctx.restore();
}

/* ---------- partículas ---------- */
function blood(x, y, n, big) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, v = (40 + Math.random() * (big ? 240 : 140)) * K;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: .5 + Math.random() * .5, max: 1, col: Math.random() < .8 ? '#a3262a' : '#6a1218', size: (2 + Math.random() * 3) * K, g: 500 });
  }
}
function dust(x, y) {
  for (let i = 0; i < 7; i++) {
    parts.push({ x, y, vx: (Math.random() - .5) * 90, vy: -Math.random() * 60, life: .5 + Math.random() * .3, max: 1, col: 'rgba(230,190,140,.7)', size: (3 + Math.random() * 4) * K, g: 60 });
  }
}
function floatText(x, y, txt, col, size) { floats.push({ x, y, txt, col, size: size || 18, life: 1 }); }

/* ---------- juego ---------- */
function startWave(n) {
  wave = n; toSpawn = 4 + n * 3; spawnT = 1.2;
  banner = { txt: 'Oleada ' + n, sub: '', t: 2 };
}

function newGame() {
  zs = []; parts = []; floats = [];
  score = 0; hp = 100; ammo = 6; reloading = false; combo = 0; betweenT = 0;
  shotCd = 0; shake = 0; hurt = 0; aim = -Math.PI / 2;
  state = 'play';
  menu.classList.add('hidden'); reloadBtn.classList.add('show');
  startWave(1);
}

function endGame() {
  state = 'over';
  snd.over();
  best = Math.max(best, score);
  reloadBtn.classList.remove('show');
  document.getElementById('title').textContent = 'Te mordieron';
  document.getElementById('sub').textContent = 'Oleada ' + wave + ' · ' + score + ' puntos';
  document.getElementById('msg').innerHTML = 'Tu mejor marca: ' + best + ' puntos.<br>Los muertos no se cansan, pero vos podés practicar.';
  go.textContent = 'Otra vez';
  menu.classList.remove('hidden');
}

function doReload() {
  if (state !== 'play' || reloading || ammo === 6) return;
  reloading = true; rt = 0; snd.reload();
}

function shoot(px, py) {
  if (shotCd > 0 || reloading) return;
  if (ammo <= 0) { snd.click(); doReload(); return; }
  ammo--; shotCd = .16; flash = .07; recoil = 1; shake = Math.max(shake, .08);
  const ox = W / 2 + 16 * K, oy = H - 34 * K;
  aim = Math.max(-Math.PI + .35, Math.min(-.35, Math.atan2(py - oy, px - ox)));
  snd.shot();

  let best = null, bestHead = false;
  for (const z of zs) {
    const h = z.h * K * sc(z.y), bob = Math.abs(Math.sin(z.ph)) * h * .02;
    const hx = z.x + sway(z, h), hy = z.y - h * .86 + bob, hr = Math.max(h * .15, 16);
    const head = Math.hypot(px - hx, py - hy) <= hr;
    const body = !head && Math.abs(px - z.x) <= h * .22 + 8 && py >= z.y - h * .76 - 4 && py <= z.y + 6;
    if ((head || body) && (!best || z.y > best.y)) { best = z; bestHead = head; }
  }

  if (best) {
    best.hp -= bestHead ? best.hd : 1;
    best.flash = .1;
    best.y = Math.max(HZ, best.y - (bestHead ? 12 : 5) * K);
    blood(px, py, bestHead ? 12 : 7, bestHead);
    if (best.hp <= 0) {
      combo++;
      const mult = Math.min(5, 1 + Math.floor(combo / 4));
      const pts = best.pts * (bestHead ? 2 : 1) * mult;
      score += pts;
      blood(best.x, best.y - best.h * K * sc(best.y) * .5, 26, true);
      floatText(best.x, best.y - best.h * K * sc(best.y), '+' + pts + (bestHead ? ' ¡cabeza!' : ''), bestHead ? '#ffd24a' : '#f3d9a4', bestHead ? 22 : 18);
      zs.splice(zs.indexOf(best), 1);
      snd.kill();
    } else {
      snd.hit();
    }
  } else {
    combo = 0;
    if (py > HZ) dust(px, py);
  }
  if (ammo === 0) setTimeout(() => { if (state === 'play' && !reloading) doReload(); }, 250);
}

function update(dt) {
  shotCd -= dt; flash -= dt; recoil = Math.max(0, recoil - dt * 6);
  shake = Math.max(0, shake - dt); hurt = Math.max(0, hurt - dt);
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }

  for (const p of parts) { p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  parts = parts.filter(p => p.life > 0);
  for (const f of floats) { f.life -= dt; f.y -= 34 * dt; }
  floats = floats.filter(f => f.life > 0);

  if (state !== 'play') return;

  if (reloading) { rt += dt; if (rt >= 1) { ammo = 6; reloading = false; } }

  if (betweenT > 0) {
    betweenT -= dt;
    if (betweenT <= 0) startWave(wave + 1);
  } else {
    spawnT -= dt;
    if (toSpawn > 0 && spawnT <= 0) {
      spawn(); toSpawn--;
      spawnT = Math.max(.45, 1.6 - wave * .08) * (.7 + Math.random() * .6);
    }
    if (toSpawn === 0 && zs.length === 0) {
      const bonus = wave * 100;
      score += bonus; hp = Math.min(100, hp + 15); ammo = 6; reloading = false;
      betweenT = 2.4;
      banner = { txt: 'Oleada ' + wave + ' superada', sub: '+' + bonus + ' puntos', t: 2.2 };
    }
  }

  for (const z of zs) {
    z.flash -= dt;
    z.ph += dt * (2.5 + z.spd * .06);
    if (z.y < HEND) {
      z.y += z.spd * K * (.4 + sc(z.y)) * dt;
      if (z.y > HEND) z.y = HEND;
    } else {
      z.atk -= dt;
      if (z.atk <= 0) {
        z.atk = .9; hp -= z.dmg; shake = .35; hurt = .5; snd.hurt();
        if (hp <= 0) { hp = 0; endGame(); return; }
      }
    }
    const p = (z.y - HZ) / (HEND - HZ);
    z.x = z.x0 + (z.x1 - z.x0) * p + Math.sin(z.ph * .5 + z.wob) * 5 * K * sc(z.y);
  }
}

/* ---------- dibujo ---------- */
function drawPlayer() {
  const gx = W / 2;
  ctx.fillStyle = '#1d0c11';
  ctx.beginPath(); ctx.ellipse(gx, H + 24 * K, 96 * K, 76 * K, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#3a1d1a';
  ctx.beginPath(); ctx.ellipse(gx, H - 56 * K, 56 * K, 12 * K, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.roundRect(gx - 28 * K, H - 90 * K, 56 * K, 36 * K, [14 * K, 14 * K, 2, 2]); ctx.fill();
  ctx.fillStyle = '#b3262d'; ctx.fillRect(gx - 28 * K, H - 64 * K, 56 * K, 6 * K);

  ctx.save();
  ctx.translate(gx + 16 * K, H - 34 * K);
  ctx.rotate(aim);
  if (Math.cos(aim) < 0) ctx.scale(1, -1);
  ctx.translate(-recoil * 12 * K, 0);
  ctx.fillStyle = '#4a2218'; ctx.fillRect(-4 * K, -7 * K, 30 * K, 14 * K);
  ctx.fillStyle = '#6b3a28'; ctx.fillRect(22 * K, 2 * K, 9 * K, 18 * K);
  ctx.fillStyle = '#8a8f98'; ctx.fillRect(24 * K, -9 * K, 22 * K, 13 * K);
  ctx.fillStyle = '#b0b4bb'; ctx.fillRect(30 * K, -11 * K, 10 * K, 16 * K);
  ctx.fillStyle = '#c9ccd2'; ctx.fillRect(46 * K, -7 * K, 40 * K, 8 * K);
  if (flash > 0) {
    ctx.fillStyle = '#ffd24a';
    ctx.beginPath();
    const cx = 90 * K;
    for (let i = 0; i < 10; i++) {
      const a = i * Math.PI / 5, rr = (i % 2 ? 9 : 24) * K;
      ctx.lineTo(cx + Math.cos(a) * rr, -3 * K + Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff6cf';
    ctx.beginPath(); ctx.arc(cx, -3 * K, 7 * K, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function drawHUD() {
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#f3d9a4'; ctx.font = `28px ${FONT}`; ctx.textAlign = 'left';
  ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 4;
  ctx.fillText(score, 14, 10);
  ctx.font = `bold 14px Georgia,serif`;
  ctx.fillText('Oleada ' + wave, 14, 44);

  const bw = 110, bx = W - bw - 14;
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(26,11,16,.7)'; ctx.fillRect(bx - 2, 12, bw + 4, 16);
  ctx.fillStyle = hp > 35 ? '#c9a84a' : '#c33'; ctx.fillRect(bx, 14, bw * hp / 100, 12);
  ctx.fillStyle = '#f3d9a4'; ctx.font = 'bold 12px Georgia,serif'; ctx.textAlign = 'right';
  ctx.fillText('Vida', bx - 8, 14);

  if (combo >= 2) {
    const mult = Math.min(5, 1 + Math.floor(combo / 4));
    ctx.fillStyle = '#ffd24a'; ctx.font = `20px ${FONT}`;
    ctx.fillText(combo + ' seguidos · x' + mult, W - 14, 38);
  }

  const by = H - 36;
  for (let i = 0; i < 6; i++) {
    const has = i < ammo && !reloading;
    ctx.fillStyle = has ? '#e0b24a' : 'rgba(243,217,164,.18)';
    ctx.fillRect(14 + i * 13, by + 8, 8, 20);
    ctx.fillStyle = has ? '#b3262d' : 'rgba(243,217,164,.18)';
    ctx.fillRect(14 + i * 13, by, 8, 8);
  }
  if (reloading) {
    ctx.fillStyle = 'rgba(26,11,16,.7)'; ctx.fillRect(14, by - 12, 76, 6);
    ctx.fillStyle = '#f3d9a4'; ctx.fillRect(14, by - 12, 76 * Math.min(1, rt), 6);
  }
  ctx.textAlign = 'left';
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * shake * 28, (Math.random() - .5) * shake * 28);
  ctx.drawImage(bg, 0, 0, W, H);

  zs.sort((a, b) => a.y - b.y);
  for (const z of zs) drawZ(z);

  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
    ctx.fillStyle = p.col; ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  drawPlayer();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of floats) {
    ctx.globalAlpha = Math.min(1, f.life * 2);
    ctx.font = `bold ${f.size * K}px Georgia,serif`;
    ctx.fillStyle = 'rgba(26,11,16,.8)'; ctx.fillText(f.txt, f.x + 1.5, f.y + 1.5);
    ctx.fillStyle = f.col; ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (hurt > 0) {
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .25, W / 2, H / 2, Math.max(W, H) * .7);
    g.addColorStop(0, 'rgba(179,38,45,0)'); g.addColorStop(1, `rgba(179,38,45,${hurt * 1.1})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  if (state === 'play') drawHUD();

  if (banner && state === 'play') {
    ctx.globalAlpha = Math.min(1, banner.t / .5);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `${Math.min(46, W * .11)}px ${FONT}`;
    ctx.fillStyle = '#b3262d'; ctx.fillText(banner.txt, W / 2 + 3, H * .28 + 3);
    ctx.fillStyle = '#f3d9a4'; ctx.fillText(banner.txt, W / 2, H * .28);
    if (banner.sub) { ctx.font = 'bold 20px Georgia,serif'; ctx.fillText(banner.sub, W / 2, H * .28 + 40); }
    ctx.globalAlpha = 1;
  }
}

let last = 0;
function loop(t) {
  const dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
  update(dt); draw();
  requestAnimationFrame(loop);
}

/* ---------- controles ---------- */
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();
  if (state === 'play') shoot(e.clientX, e.clientY);
});
reloadBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); initAudio(); doReload(); });
go.addEventListener('click', () => { initAudio(); newGame(); });
window.addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') doReload(); });
document.addEventListener('contextmenu', e => e.preventDefault());

resize();
requestAnimationFrame(loop);
})();
</script>
</body>

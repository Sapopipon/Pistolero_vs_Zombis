<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pistolero 3D contra los muertos</title>
<link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#261016; --sand:#f3d9a4; --blood:#b3262d; --dusk:#e08a4b; }
  *{box-sizing:border-box}
  html,body{
    margin:0;height:100%;background:#1a0b10;overflow:hidden;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    font-family:Georgia,'Times New Roman',serif;color:var(--sand);
  }
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hud{pointer-events:none}
  #menu{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;text-align:center;background:rgba(26,11,16,.72);
  }
  #menu.hidden{display:none}
  h1{
    font-family:'Rye',Georgia,serif;font-weight:400;
    font-size:clamp(40px,12vw,72px);line-height:1;margin:0 0 6px;color:var(--sand);
    text-shadow:3px 3px 0 var(--blood);
  }
  .sub{font-style:italic;font-size:18px;margin:0 0 22px;color:var(--dusk)}
  #msg{max-width:310px;font-size:17px;line-height:1.5;margin:0 0 28px}
  button{
    font-family:'Rye',Georgia,serif;font-size:22px;letter-spacing:.5px;
    background:var(--sand);color:var(--ink);border:3px solid var(--ink);border-radius:6px;
    padding:14px 30px;box-shadow:5px 5px 0 var(--blood);cursor:pointer;
  }
  button:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--blood)}
  button:focus-visible{outline:3px solid #fff;outline-offset:3px}
  #reload{
    position:fixed;right:14px;bottom:14px;font-size:16px;padding:12px 16px;display:none;
    box-shadow:4px 4px 0 var(--blood);
  }
  #reload.show{display:block}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<button id="reload">Recargar</button>
<div id="menu">
  <h1 id="title">Pistolero 3D</h1>
  <p class="sub" id="sub">contra los muertos</p>
  <p id="msg">Arrastrá el dedo para girar.<br>Tocá a un zombi para dispararle: la cabeza vale doble.<br>El radar de arriba te muestra por dónde vienen.</p>
  <button id="go">Desenfundar</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const glc = document.getElementById('gl'), hud = document.getElementById('hud'), ctx = hud.getContext('2d');
const menu = document.getElementById('menu'), go = document.getElementById('go');
const reloadBtn = document.getElementById('reload');
const FONT = "'Rye',Georgia,serif";

if (typeof THREE === 'undefined') {
  document.getElementById('msg').textContent = 'No se pudo cargar el motor 3D. Revisá tu conexión a internet y recargá la página.';
  go.style.display = 'none';
  return;
}

/* ---------- estado ---------- */
let W, H, DPR, aspect;
let state = 'menu';
let zs = [], dead = [], parts = [], floats = [], tracers = [];
let score = 0, best = 0, hp = 100, ammo = 6, reloading = false, rt = 0;
let combo = 0, wave = 0, toSpawn = 0, spawnT = 0, betweenT = 0, banner = null;
let shotCd = 0, flash = 0, recoil = 0, shake = 0, hurt = 0;
let yaw = 0, pitch = 0, aimX = 0, aimY = 0;
const keys = {};

/* ---------- audio ---------- */
let ac = null;
function initAudio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume();
}
function noise(dur, vol, cutoff) {
  if (!ac) return;
  const t = ac.currentTime;
  const b = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
  const n = ac.createBufferSource(); n.buffer = b;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
  const g = ac.createGain(); g.gain.value = vol;
  n.connect(f); f.connect(g); g.connect(ac.destination); n.start(t);
}
function tone(f0, f1, dur, type, vol, delay = 0) {
  if (!ac) return;
  const t = ac.currentTime + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + .02);
}
const snd = {
  shot() { noise(.25, .55, 2400); tone(150, 40, .18, 'sine', .6); },
  click() { tone(900, 500, .04, 'square', .12); },
  reload() { tone(700, 400, .05, 'square', .12); tone(500, 300, .05, 'square', .12, .35); tone(900, 600, .06, 'square', .14, .8); },
  hit() { noise(.12, .3, 900); tone(120, 60, .1, 'triangle', .3); },
  kill() { noise(.2, .35, 700); tone(90, 40, .2, 'sawtooth', .25); },
  hurt() { tone(110, 45, .3, 'sawtooth', .35); noise(.2, .3, 500); },
  over() { tone(220, 55, 1.1, 'sawtooth', .3); }
};

/* ---------- three.js: base ---------- */
const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true });
const scene = new THREE.Scene();
const FOG = 0xc9806b;
scene.fog = new THREE.Fog(FOG, 12, 82);
scene.background = new THREE.Color(FOG);

const camera = new THREE.PerspectiveCamera(70, 1, .1, 400);
camera.rotation.order = 'YXZ';
camera.position.set(0, 1.7, 0);
scene.add(camera);

scene.add(new THREE.HemisphereLight(0xffc8a0, 0x6a4a50, 1.0));
const sunLight = new THREE.DirectionalLight(0xffb070, .6);
sunLight.position.set(70, 30, -150);
scene.add(sunLight);

const BOX = new THREE.BoxGeometry(1, 1, 1);
const mk = (mat, sx, sy, sz, x, y, z) => {
  const m = new THREE.Mesh(BOX, mat);
  m.scale.set(sx, sy, sz); m.position.set(x, y, z);
  return m;
};
const lam = c => new THREE.MeshLambertMaterial({ color: c });
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];

/* cielo */
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(200, 24, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    vertexShader: 'varying vec3 vP; void main(){ vP=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: 'varying vec3 vP; void main(){ float h=clamp(vP.y,0.0,1.0); vec3 hor=vec3(.788,.502,.42); vec3 mid=vec3(.56,.25,.33); vec3 top=vec3(.17,.08,.19); vec3 c=mix(hor,mid,smoothstep(0.0,.25,h)); c=mix(c,top,smoothstep(.2,.8,h)); if(vP.y<0.0) c=hor; gl_FragColor=vec4(c,1.0); }'
  })
);
scene.add(sky);

const sunGlow = new THREE.Mesh(new THREE.SphereGeometry(30, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffb36a, transparent: true, opacity: .35, fog: false }));
sunGlow.position.set(70, 18, -150); scene.add(sunGlow);
const sun = new THREE.Mesh(new THREE.SphereGeometry(14, 20, 14), new THREE.MeshBasicMaterial({ color: 0xffe2a0, fog: false }));
sun.position.copy(sunGlow.position); scene.add(sun);

/* mesetas lejanas */
const mesaMat = new THREE.MeshBasicMaterial({ color: 0x6b2f43, fog: false });
for (let i = 0; i < 14; i++) {
  const a = (i / 14) * Math.PI * 2 + rnd(-.15, .15), r = rnd(12, 26), h = rnd(10, 26);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r * .75, r, h, 7), mesaMat);
  m.position.set(Math.sin(a) * 150, h / 2 - 1, Math.cos(a) * 150);
  scene.add(m);
}

/* suelo */
(() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#b98558'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2600; i++) {
    g.fillStyle = `rgba(${60 + Math.random() * 60 | 0},${30 + Math.random() * 40 | 0},20,${.08 + Math.random() * .12})`;
    g.fillRect(Math.random() * 256, Math.random() * 256, 1 + Math.random() * 3, 1 + Math.random() * 3);
  }
  for (let i = 0; i < 1200; i++) {
    g.fillStyle = `rgba(240,200,150,${.05 + Math.random() * .1})`;
    g.fillRect(Math.random() * 256, Math.random() * 256, 1 + Math.random() * 2, 1 + Math.random() * 2);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(60, 60);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshLambertMaterial({ map: tex }));
  ground.rotation.x = -Math.PI / 2; scene.add(ground);

  const roadMat = new THREE.MeshLambertMaterial({ color: 0xe0b078, transparent: true, opacity: .45 });
  const r1 = new THREE.Mesh(new THREE.PlaneGeometry(9, 260), roadMat);
  r1.rotation.x = -Math.PI / 2; r1.position.y = .02; scene.add(r1);
  const r2 = r1.clone(); r2.rotation.z = Math.PI / 2; r2.position.y = .03; scene.add(r2);
})();

/* pueblo */
function building(x, z, w, h, d, col) {
  const g = new THREE.Group();
  const m = lam(col), m2 = lam(new THREE.Color(col).multiplyScalar(.85).getHex()), dark = lam(0x2a1612);
  g.add(mk(m, w, h, d, 0, h / 2, 0));
  g.add(mk(m2, w * 1.02, h * 1.28, .4, 0, h * 1.28 / 2, d / 2 + .2));
  g.add(mk(dark, w, .22, 2.4, 0, h * .55, d / 2 + 1.3));
  g.add(mk(dark, .22, h * .55, .22, -w / 2 + .3, h * .275, d / 2 + 2.3));
  g.add(mk(dark, .22, h * .55, .22, w / 2 - .3, h * .275, d / 2 + 2.3));
  const win = new THREE.MeshBasicMaterial({ color: 0xf3b562 });
  g.add(mk(win, w * .18, h * .2, .05, -w * .28, h * .3, d / 2 + .02));
  g.add(mk(win, w * .18, h * .2, .05, w * .28, h * .3, d / 2 + .02));
  g.add(mk(dark, w * .16, h * .38, .05, 0, h * .19, d / 2 + .02));
  g.position.set(x, 0, z);
  g.rotation.y = Math.atan2(-x, -z);
  scene.add(g);
}
const WOODS = [0x6b4a3a, 0x7a5540, 0x5a3b34, 0x84603f, 0x4f3a40];
for (let i = 0; i < 20; i++) {
  const a = (i / 20) * Math.PI * 2 + rnd(-.1, .1), r = rnd(46, 58);
  building(Math.sin(a) * r, Math.cos(a) * r, rnd(7, 12), rnd(4.5, 7), rnd(6, 9), pick(WOODS));
}

const cactMat = lam(0x34502f);
function cactus(x, z, s) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(.24, .3, 2.6, 8), cactMat); body.position.y = 1.3; g.add(body);
  const a1 = new THREE.Mesh(new THREE.CylinderGeometry(.16, .16, .9, 8), cactMat); a1.position.set(-.45, 1.5, 0); g.add(a1);
  const a1b = new THREE.Mesh(new THREE.CylinderGeometry(.16, .16, .5, 8), cactMat); a1b.rotation.z = Math.PI / 2; a1b.position.set(-.25, 1.1, 0); g.add(a1b);
  const a2 = new THREE.Mesh(new THREE.CylinderGeometry(.16, .16, .8, 8), cactMat); a2.position.set(.45, 1.8, 0); g.add(a2);
  const a2b = new THREE.Mesh(new THREE.CylinderGeometry(.16, .16, .5, 8), cactMat); a2b.rotation.z = Math.PI / 2; a2b.position.set(.25, 1.4, 0); g.add(a2b);
  g.scale.setScalar(s); g.position.set(x, 0, z); scene.add(g);
}
const barrelMat = lam(0x5a3a22), crateMat = lam(0x7a5a38), rockMat = lam(0x7a5548);
for (let i = 0; i < 18; i++) {
  const a = rnd(0, 6.283), r = rnd(37, 43), x = Math.sin(a) * r, z = Math.cos(a) * r, t = Math.random();
  if (t < .4) cactus(x, z, rnd(.8, 1.5));
  else if (t < .6) { const b = new THREE.Mesh(new THREE.CylinderGeometry(.5, .5, 1.1, 10), barrelMat); b.position.set(x, .55, z); scene.add(b); }
  else if (t < .8) { const c = mk(crateMat, 1.1, 1.1, 1.1, x, .55, z); c.rotation.y = Math.random() * 3; scene.add(c); }
  else { const rk = new THREE.Mesh(new THREE.IcosahedronGeometry(rnd(.6, 1.3), 0), rockMat); rk.position.set(x, .3, z); rk.rotation.set(Math.random(), Math.random(), 0); scene.add(rk); }
}

/* ---------- revólver en primera persona ---------- */
const gunG = new THREE.Group();
const GUN_BASE = new THREE.Vector3(.22, -.25, -.48);
gunG.position.copy(GUN_BASE);
camera.add(gunG);
(() => {
  const sleeve = mk(lam(0x4a2218), .1, .1, .55, .03, -.04, .22); sleeve.rotation.x = -.1; gunG.add(sleeve);
  gunG.add(mk(lam(0xd6a77a), .09, .09, .11, 0, -.02, .02));
  gunG.add(mk(lam(0x8a8f98), .05, .09, .2, 0, .02, -.12));
  const cyl = new THREE.Mesh(new THREE.CylinderGeometry(.046, .046, .09, 10), lam(0xb0b4bb));
  cyl.rotation.x = Math.PI / 2; cyl.position.set(0, .03, -.1); gunG.add(cyl);
  gunG.add(mk(lam(0xc9ccd2), .032, .032, .3, 0, .045, -.34));
  const grip = mk(lam(0x6b3a28), .04, .12, .06, 0, -.06, -.03); grip.rotation.x = .3; gunG.add(grip);
})();
const muzzle = new THREE.Object3D(); muzzle.position.set(0, .045, -.5); gunG.add(muzzle);
const flashMat = new THREE.MeshBasicMaterial({ color: 0xffd24a, transparent: true, opacity: .95, blending: THREE.AdditiveBlending, depthWrite: false, fog: false });
const flashMesh = new THREE.Mesh(new THREE.PlaneGeometry(.3, .3), flashMat);
const flashMesh2 = flashMesh.clone(); flashMesh2.rotation.z = Math.PI / 4;
const flashGroup = new THREE.Group(); flashGroup.add(flashMesh, flashMesh2); flashGroup.visible = false;
flashGroup.position.set(0, .045, -.52); gunG.add(flashGroup);
const flashLight = new THREE.PointLight(0xffc060, 0, 14); flashLight.position.set(0, .1, -.6); gunG.add(flashLight);

/* ---------- zombis ---------- */
const TYPES = {
  walker: { s: 1,    spd: 1.9, hp: 2, hd: 2, dmg: 8,  pts: 50 },
  runner: { s: .95,  spd: 4.2, hp: 2, hd: 2, dmg: 6,  pts: 80 },
  brute:  { s: 1.45, spd: 1.3, hp: 7, hd: 3, dmg: 20, pts: 250 }
};
const SKINS = [0x8da86b, 0x9bb27a, 0x7f9a63];
const SHIRTS = [0x5b3a46, 0x3f5565, 0x6d5a35, 0x4a2f2f];
const PANTS = [0x2c2a3a, 0x3a3226];
const eyeMat = new THREE.MeshBasicMaterial({ color: 0xf0e46a });
const darkMat = new THREE.MeshBasicMaterial({ color: 0x1a0b10 });
const gashMat = new THREE.MeshBasicMaterial({ color: 0x8c191e });
const blobGeo = new THREE.CircleGeometry(.6, 14); blobGeo.rotateX(-Math.PI / 2);
const blobMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: .3, depthWrite: false });

function makeZombie(type) {
  const T = TYPES[type];
  const skin = lam(pick(SKINS)), shirt = lam(type === 'runner' ? 0x7a2f2f : pick(SHIRTS)), pants = lam(pick(PANTS));
  const root = new THREE.Group(), body = new THREE.Group();
  root.add(body);
  const blob = new THREE.Mesh(blobGeo, blobMat); blob.position.y = .02; root.add(blob);

  const legL = new THREE.Group(); legL.position.set(-.14, .8, 0); legL.add(mk(pants, .22, .8, .24, 0, -.4, 0)); body.add(legL);
  const legR = new THREE.Group(); legR.position.set(.14, .8, 0); legR.add(mk(pants, .22, .8, .24, 0, -.4, 0)); body.add(legR);
  body.add(mk(shirt, .52, .7, .28, 0, 1.15, 0));
  body.add(mk(gashMat, .14, .14, .02, -.08, 1.2, .145));
  body.add(mk(darkMat, .2, .08, .02, .1, 0.95, .145));
  const armL = new THREE.Group(); armL.position.set(-.36, 1.42, 0);
  armL.add(mk(skin, .15, .62, .15, 0, -.31, 0)); armL.add(mk(shirt, .17, .22, .17, 0, -.11, 0)); armL.rotation.x = -1.4; body.add(armL);
  const armR = new THREE.Group(); armR.position.set(.36, 1.42, 0);
  armR.add(mk(skin, .15, .62, .15, 0, -.31, 0)); armR.add(mk(shirt, .17, .22, .17, 0, -.11, 0)); armR.rotation.x = -1.4; body.add(armR);
  body.add(mk(skin, .34, .36, .34, 0, 1.72, 0));
  body.add(mk(eyeMat, .07, .05, .02, -.08, 1.75, .175));
  body.add(mk(eyeMat, .07, .05, .02, .08, 1.75, .175));
  body.add(mk(darkMat, .14, .06, .02, 0, 1.62, .175));
  if (type === 'runner') body.rotation.x = .22;
  root.scale.setScalar(T.s);
  return { root, body, legL, legR, armL, armR, mats: [skin, shirt, pants] };
}

function spawn() {
  const r = Math.random();
  let type = 'walker';
  if (wave >= 4 && r < .12) type = 'brute';
  else if (wave >= 2 && r < .38) type = 'runner';
  const T = TYPES[type], parts3 = makeZombie(type);
  const a = Math.random() < .55 ? yaw + Math.PI + (Math.random() - .5) * 1.6 : Math.random() * 6.283;
  const rad = rnd(31, 34);
  parts3.root.position.set(Math.sin(a) * rad, 0, Math.cos(a) * rad);
  scene.add(parts3.root);
  zs.push(Object.assign(parts3, {
    type, s: T.s, spd: T.spd * (1 + wave * .04) * rnd(.9, 1.1), hp: T.hp, hd: T.hd, dmg: T.dmg, pts: T.pts,
    ph: Math.random() * 6, flash: 0, flashOn: false, atk: .5, attacking: false
  }));
}

function setFlash(z, on) {
  z.flashOn = on;
  for (const m of z.mats) m.emissive.setHex(on ? 0xaa5544 : 0x000000);
}

function removeZombie(z) {
  scene.remove(z.root);
  for (const m of z.mats) m.dispose();
}

/* ---------- partículas ---------- */
const POOL = [];
for (let i = 0; i < 160; i++) {
  const m = new THREE.Mesh(BOX, new THREE.MeshBasicMaterial({ color: 0xa3262a, transparent: true }));
  m.visible = false; scene.add(m);
  POOL.push({ mesh: m, vel: new THREE.Vector3(), life: 0, g: 14, free: true });
}
function emit(pos, vel, color, size, life, g) {
  const p = POOL.find(q => q.free); if (!p) return;
  p.free = false; p.life = life; p.max = life; p.g = g;
  p.mesh.visible = true; p.mesh.position.copy(pos); p.mesh.scale.setScalar(size);
  p.mesh.material.color.setHex(color); p.mesh.material.opacity = 1;
  p.vel.copy(vel);
}
function bloodAt(pos, n, big) {
  for (let i = 0; i < n; i++) {
    const v = new THREE.Vector3(rnd(-1, 1), rnd(-.2, 1.2), rnd(-1, 1)).multiplyScalar(big ? 4.5 : 2.8);
    emit(pos, v, Math.random() < .8 ? 0xa3262a : 0x6a1218, rnd(.05, .12), rnd(.5, 1), 14);
  }
}
function dustAt(pos) {
  for (let i = 0; i < 8; i++) {
    const v = new THREE.Vector3(rnd(-1.2, 1.2), rnd(.5, 2.2), rnd(-1.2, 1.2));
    emit(pos, v, 0xe3bd8c, rnd(.12, .25), rnd(.4, .7), 3);
  }
}
function tracer(a, b) {
  const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xffe08a, transparent: true }));
  scene.add(line); tracers.push({ line, t: .08 });
}
function floatText(pos, txt, col, size) { floats.push({ pos: pos.clone(), txt, col, size: size || 18, life: 1 }); }

/* ---------- proyección y disparo ---------- */
const _v = new THREE.Vector3();
function toScreen(v) {
  const tanF = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const vc = _v.copy(v).applyMatrix4(camera.matrixWorldInverse);
  if (vc.z >= -.1) return null;
  const d = -vc.z;
  return {
    x: (vc.x / (d * tanF * aspect) * .5 + .5) * W,
    y: (-vc.y / (d * tanF) * .5 + .5) * H,
    d, pxm: H / (2 * d * tanF)
  };
}

function pickZombie(px, py) {
  camera.updateMatrixWorld();
  let best = null, bestHead = false, bd = 1e9;
  for (const z of zs) {
    const p = z.root.position, s = z.s;
    const hs = toScreen(new THREE.Vector3(p.x, 1.72 * s, p.z));
    const bs = toScreen(new THREE.Vector3(p.x, .95 * s, p.z));
    if (!hs || !bs) continue;
    const hr = Math.max(.3 * s * hs.pxm, 22);
    const head = Math.hypot(px - hs.x, py - hs.y) <= hr;
    const rx = Math.max(.42 * s * bs.pxm, 26), ry = Math.max(.95 * s * bs.pxm, 34);
    const body = ((px - bs.x) / rx) ** 2 + ((py - bs.y) / ry) ** 2 <= 1;
    if ((head || body) && bs.d < bd) { best = z; bestHead = head; bd = bs.d; }
  }
  return best ? { z: best, head: bestHead } : null;
}

function shoot(px, py) {
  if (state !== 'play' || shotCd > 0 || reloading) return;
  if (ammo <= 0) { snd.click(); doReload(); return; }
  ammo--; shotCd = .16; flash = .06; recoil = 1; shake = Math.max(shake, .06);
  aimX = (px / W) * 2 - 1; aimY = -((py / H) * 2 - 1);
  snd.shot();

  camera.updateMatrixWorld();
  const origin = new THREE.Vector3(); muzzle.getWorldPosition(origin);
  const dir = new THREE.Vector3(aimX, aimY, .5).unproject(camera).sub(camera.position).normalize();
  const hit = pickZombie(px, py);
  let target;

  if (hit) {
    const z = hit.z, head = hit.head, p = z.root.position;
    target = new THREE.Vector3(p.x, (head ? 1.72 : 1.1) * z.s, p.z);
    z.hp -= head ? z.hd : 1;
    z.flash = .1;
    const back = Math.hypot(p.x, p.z) || 1, kb = head ? .7 : .3;
    p.x += p.x / back * kb; p.z += p.z / back * kb;
    bloodAt(target, head ? 14 : 8, head);
    if (z.hp <= 0) {
      combo++;
      const mult = Math.min(5, 1 + Math.floor(combo / 4));
      const pts = z.pts * (head ? 2 : 1) * mult;
      score += pts;
      bloodAt(target, 30, true);
      floatText(target.clone().add(new THREE.Vector3(0, .4, 0)), '+' + pts + (head ? ' ¡cabeza!' : ''), head ? '#ffd24a' : '#f3d9a4', head ? 22 : 18);
      zs.splice(zs.indexOf(z), 1);
      dead.push({ z, t: 0 });
      snd.kill();
    } else {
      snd.hit();
    }
  } else {
    combo = 0;
    target = origin.clone().add(dir.clone().multiplyScalar(40));
    if (dir.y < -.01) {
      const t = -camera.position.y / dir.y;
      if (t > 0 && t < 60) {
        target = camera.position.clone().add(dir.clone().multiplyScalar(t));
        dustAt(target.clone().setY(.1));
      }
    }
  }
  tracer(origin, target);
  if (ammo === 0) setTimeout(() => { if (state === 'play' && !reloading) doReload(); }, 250);
}

function doReload() {
  if (state !== 'play' || reloading || ammo === 6) return;
  reloading = true; rt = 0; snd.reload();
}

/* ---------- partidas ---------- */
function startWave(n) {
  wave = n; toSpawn = 4 + n * 3; spawnT = 1.2;
  banner = { txt: 'Oleada ' + n, sub: '', t: 2 };
}

function clearWorld() {
  for (const z of zs) removeZombie(z);
  for (const d of dead) removeZombie(d.z);
  zs = []; dead = [];
  for (const p of POOL) { p.free = true; p.mesh.visible = false; }
  for (const t of tracers) { scene.remove(t.line); t.line.geometry.dispose(); t.line.material.dispose(); }
  tracers = []; floats = [];
}

function newGame() {
  clearWorld();
  score = 0; hp = 100; ammo = 6; reloading = false; combo = 0; betweenT = 0;
  shotCd = 0; shake = 0; hurt = 0; yaw = 0; pitch = 0;
  state = 'play';
  menu.classList.add('hidden'); reloadBtn.classList.add('show');
  startWave(1);
}

function endGame() {
  state = 'over';
  snd.over();
  best = Math.max(best, score);
  reloadBtn.classList.remove('show');
  document.getElementById('title').textContent = 'Te mordieron';
  document.getElementById('sub').textContent = 'Oleada ' + wave + ' · ' + score + ' puntos';
  document.getElementById('msg').innerHTML = 'Tu mejor marca: ' + best + ' puntos.<br>Los muertos no se cansan, pero vos podés practicar.';
  go.textContent = 'Otra vez';
  menu.classList.remove('hidden');
}

/* ---------- actualización ---------- */
function update(dt) {
  shotCd -= dt; flash -= dt; recoil = Math.max(0, recoil - dt * 6);
  shake = Math.max(0, shake - dt); hurt = Math.max(0, hurt - dt);
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }

  if (keys.ArrowLeft || keys.a) yaw += dt * 1.8;
  if (keys.ArrowRight || keys.d) yaw -= dt * 1.8;
  if (state !== 'play') yaw += dt * .04;

  for (const p of POOL) {
    if (p.free) continue;
    p.life -= dt;
    if (p.life <= 0) { p.free = true; p.mesh.visible = false; continue; }
    p.vel.y -= p.g * dt;
    p.mesh.position.addScaledVector(p.vel, dt);
    if (p.mesh.position.y < .03) { p.mesh.position.y = .03; p.vel.set(0, 0, 0); }
    p.mesh.material.opacity = Math.min(1, p.life * 2.5);
  }
  for (let i = tracers.length - 1; i >= 0; i--) {
    const t = tracers[i]; t.t -= dt; t.line.material.opacity = Math.max(0, t.t / .08);
    if (t.t <= 0) { scene.remove(t.line); t.line.geometry.dispose(); t.line.material.dispose(); tracers.splice(i, 1); }
  }
  for (const f of floats) { f.life -= dt; f.pos.y += dt * .9; }
  floats = floats.filter(f => f.life > 0);

  for (let i = dead.length - 1; i >= 0; i--) {
    const d = dead[i]; d.t += dt;
    const k = Math.min(1, d.t / .5);
    d.z.body.rotation.x = -(1 - (1 - k) * (1 - k)) * (Math.PI / 2);
    d.z.body.position.y = d.t > 1.4 ? -(d.t - 1.4) * .8 : 0;
    d.z.armL.rotation.x = d.z.armR.rotation.x = -1.4 + k * 1.2;
    if (d.t > 2.2) { removeZombie(d.z); dead.splice(i, 1); }
  }

  if (state !== 'play') return;

  if (reloading) { rt += dt; if (rt >= 1) { ammo = 6; reloading = false; } }

  if (betweenT > 0) {
    betweenT -= dt;
    if (betweenT <= 0) startWave(wave + 1);
  } else {
    spawnT -= dt;
    if (toSpawn > 0 && spawnT <= 0) {
      spawn(); toSpawn--;
      spawnT = Math.max(.45, 1.6 - wave * .08) * (.7 + Math.random() * .6);
    }
    if (toSpawn === 0 && zs.length === 0) {
      const bonus = wave * 100;
      score += bonus; hp = Math.min(100, hp + 15); ammo = 6; reloading = false;
      betweenT = 2.4;
      banner = { txt: 'Oleada ' + wave + ' superada', sub: '+' + bonus + ' puntos', t: 2.2 };
    }
  }

  for (const z of zs) {
    const p = z.root.position;
    const dx = -p.x, dz = -p.z, dist = Math.hypot(dx, dz) || .001;
    z.root.rotation.y = Math.atan2(dx, dz);
    const reach = 1.3 + .25 * z.s;
    if (z.flash > 0) { z.flash -= dt; if (!z.flashOn) setFlash(z, true); }
    else if (z.flashOn) setFlash(z, false);

    if (dist > reach) {
      z.attacking = false;
      const v = z.spd * dt;
      p.x += dx / dist * v; p.z += dz / dist * v;
      z.ph += dt * z.spd * 3.2;
      z.armL.rotation.x = z.armR.rotation.x = -1.4 + Math.sin(z.ph * .5) * .1;
    } else {
      z.attacking = true;
      z.ph += dt * 6;
      z.armL.rotation.x = -1.2 + Math.sin(z.ph) * .5;
      z.armR.rotation.x = -1.2 - Math.sin(z.ph) * .5;
      z.atk -= dt;
      if (z.atk <= 0) {
        z.atk = .9; hp -= z.dmg; shake = .35; hurt = .5; snd.hurt();
        if (hp <= 0) { hp = 0; endGame(); return; }
      }
    }
    z.legL.rotation.x = Math.sin(z.ph) * .6;
    z.legR.rotation.x = -Math.sin(z.ph) * .6;
    z.body.position.y = Math.abs(Math.sin(z.ph)) * .05;
    z.body.rotation.z = Math.sin(z.ph) * .05;
  }
}

/* ---------- HUD ---------- */
function drawRadar() {
  const R = 46, cx = W / 2, cy = 12 + R, RANGE = 34;
  ctx.fillStyle = 'rgba(26,11,16,.6)';
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(243,217,164,.4)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = 'rgba(243,217,164,.15)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, R * .5, 0, 7); ctx.stroke();

  const vf = THREE.MathUtils.degToRad(camera.fov / 2);
  const hf = Math.atan(Math.tan(vf) * aspect);
  ctx.fillStyle = 'rgba(243,217,164,.16)';
  ctx.beginPath(); ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, R, -Math.PI / 2 - hf, -Math.PI / 2 + hf); ctx.closePath(); ctx.fill();

  const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
  for (const z of zs) {
    const p = z.root.position;
    let sx = (p.x * rx + p.z * rz) * (R / RANGE), sy = -(p.x * fx + p.z * fz) * (R / RANGE);
    const len = Math.hypot(sx, sy);
    if (len > R * .92) { sx *= R * .92 / len; sy *= R * .92 / len; }
    ctx.fillStyle = z.attacking ? '#ff4a35' : (z.type === 'brute' ? '#d8e35a' : '#9bd35a');
    ctx.beginPath(); ctx.arc(cx + sx, cy + sy, z.type === 'brute' ? 5 : 3.2, 0, 7); ctx.fill();
  }
  ctx.fillStyle = '#f3d9a4';
  ctx.beginPath(); ctx.arc(cx, cy, 3, 0, 7); ctx.fill();
}

function drawHUD() {
  ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  ctx.fillStyle = '#f3d9a4'; ctx.font = `28px ${FONT}`;
  ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 4;
  ctx.fillText(score, 14, 10);
  ctx.font = 'bold 14px Georgia,serif';
  ctx.fillText('Oleada ' + wave, 14, 44);

  ctx.shadowBlur = 0;
  const bw = 90, bx = W - bw - 14;
  ctx.fillStyle = 'rgba(26,11,16,.7)'; ctx.fillRect(bx - 2, 12, bw + 4, 16);
  ctx.fillStyle = hp > 35 ? '#c9a84a' : '#c33'; ctx.fillRect(bx, 14, bw * hp / 100, 12);
  ctx.fillStyle = '#f3d9a4'; ctx.font = 'bold 12px Georgia,serif'; ctx.textAlign = 'right';
  ctx.fillText('Vida', W - 14, 32);

  if (combo >= 2) {
    const mult = Math.min(5, 1 + Math.floor(combo / 4));
    ctx.fillStyle = '#ffd24a'; ctx.font = `17px ${FONT}`;
    ctx.fillText(combo + ' seguidos · x' + mult, W - 14, 52);
  }

  const by = H - 36;
  for (let i = 0; i < 6; i++) {
    const has = i < ammo && !reloading;
    ctx.fillStyle = has ? '#e0b24a' : 'rgba(243,217,164,.2)';
    ctx.fillRect(14 + i * 13, by + 8, 8, 20);
    ctx.fillStyle = has ? '#b3262d' : 'rgba(243,217,164,.2)';
    ctx.fillRect(14 + i * 13, by, 8, 8);
  }
  if (reloading) {
    ctx.fillStyle = 'rgba(26,11,16,.7)'; ctx.fillRect(14, by - 12, 76, 6);
    ctx.fillStyle = '#f3d9a4'; ctx.fillRect(14, by - 12, 76 * Math.min(1, rt), 6);
  }
  ctx.textAlign = 'left';

  // mira
  const mx = W / 2, my = H / 2;
  ctx.strokeStyle = 'rgba(243,217,164,.55)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(mx, my, 10, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(mx - 16, my); ctx.lineTo(mx - 6, my); ctx.moveTo(mx + 6, my); ctx.lineTo(mx + 16, my);
  ctx.moveTo(mx, my - 16); ctx.lineTo(mx, my - 6); ctx.moveTo(mx, my + 6); ctx.lineTo(mx, my + 16); ctx.stroke();

  drawRadar();
}

function drawOverlay() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of floats) {
    const s = toScreen(f.pos); if (!s) continue;
    ctx.globalAlpha = Math.min(1, f.life * 2);
    ctx.font = `bold ${f.size}px Georgia,serif`;
    ctx.fillStyle = 'rgba(26,11,16,.8)'; ctx.fillText(f.txt, s.x + 1.5, s.y + 1.5);
    ctx.fillStyle = f.col; ctx.fillText(f.txt, s.x, s.y);
  }
  ctx.globalAlpha = 1;

  if (hurt > 0) {
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .25, W / 2, H / 2, Math.max(W, H) * .7);
    g.addColorStop(0, 'rgba(179,38,45,0)'); g.addColorStop(1, `rgba(179,38,45,${Math.min(.9, hurt * 1.2)})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  if (state === 'play') drawHUD();

  if (banner && state === 'play') {
    ctx.globalAlpha = Math.min(1, banner.t / .5);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const y = H * .3;
    ctx.font = `${Math.min(46, W * .11)}px ${FONT}`;
    ctx.fillStyle = '#b3262d'; ctx.fillText(banner.txt, W / 2 + 3, y + 3);
    ctx.fillStyle = '#f3d9a4'; ctx.fillText(banner.txt, W / 2, y);
    if (banner.sub) { ctx.font = 'bold 20px Georgia,serif'; ctx.fillText(banner.sub, W / 2, y + 40); }
    ctx.globalAlpha = 1;
  }
}

/* ---------- render ---------- */
function render(t) {
  const rel = reloading ? Math.sin(Math.min(1, rt) * Math.PI) : 0;
  const tx = aimX * -.3, ty = aimY * .22;
  gunG.rotation.y += (tx - gunG.rotation.y) * .25;
  gunG.rotation.x += (ty + recoil * .35 - gunG.rotation.x) * .35;
  gunG.rotation.z = rel * .7;
  gunG.position.set(GUN_BASE.x, GUN_BASE.y - rel * .22 + Math.sin(t / 900) * .003, GUN_BASE.z + recoil * .08);
  flashGroup.visible = flash > 0;
  flashLight.intensity = flash > 0 ? 2.2 : 0;

  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
  const sk = shake * .12;
  camera.position.set((Math.random() - .5) * sk, 1.7 + (Math.random() - .5) * sk, 0);
  renderer.render(scene, camera);
}

let last = 0;
function loop(t) {
  const dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
  update(dt); render(t); drawOverlay();
  requestAnimationFrame(loop);
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight; aspect = W / H;
  renderer.setPixelRatio(DPR);
  renderer.setSize(W, H, false);
  hud.width = W * DPR; hud.height = H * DPR;
  camera.aspect = aspect;
  camera.fov = aspect < 1 ? 85 : 70;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

/* ---------- controles ---------- */
const ptrs = new Map();
glc.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();
  glc.setPointerCapture && glc.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { sx: e.clientX, sy: e.clientY, lx: e.clientX, ly: e.clientY, t: performance.now(), moved: false });
});
glc.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  if (!p.moved && Math.hypot(e.clientX - p.sx, e.clientY - p.sy) > 12) p.moved = true;
  if (p.moved && state === 'play') {
    yaw -= (e.clientX - p.lx) * .0055;
    pitch = Math.max(-.3, Math.min(.3, pitch - (e.clientY - p.ly) * .0035));
  }
  p.lx = e.clientX; p.ly = e.clientY;
});
const endPtr = e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  ptrs.delete(e.pointerId);
  if (e.type === 'pointerup' && !p.moved && performance.now() - p.t < 400 && state === 'play') shoot(e.clientX, e.clientY);
};
glc.addEventListener('pointerup', endPtr);
glc.addEventListener('pointercancel', endPtr);

reloadBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); initAudio(); doReload(); });
go.addEventListener('click', () => { initAudio(); newGame(); });
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === 'r' || e.key === 'R') doReload();
  if (e.key === ' ') { e.preventDefault(); shoot(W / 2, H / 2); }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });
document.addEventListener('contextmenu', e => e.preventDefault());

resize();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
